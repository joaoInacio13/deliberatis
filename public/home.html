<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Deliberatis</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #141414;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 60px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #5b5ce1;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, #ffffff 0%, #a5a6f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: #8c8c8c;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #5b5ce1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #4a4bc7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(91, 92, 225, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">DELIBERATIS</div>
        <h1>Bem-vindo!</h1>
        <p>Login efetuado com sucesso no ecossistema Netuno + React.</p>
        <a href="/public/auth.html" class="btn">Terminar Sessão</a>
    </div>
</body>

</html>
